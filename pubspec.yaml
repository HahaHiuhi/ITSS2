name: student_academic_planner
description: "A premium Flutter mobile client for the Student Academic Planner MVP integrated with Supabase."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase integration
  supabase_flutter: ^2.5.0

  # Helper packages
  google_fonts: ^6.2.0
  intl: ^0.19.0
  provider: ^6.1.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
